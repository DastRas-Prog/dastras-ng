name: Build DastRas NG APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build libXray (latest Xray-core)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export PATH="$PATH:$(go env GOPATH)/bin"
          git clone --depth 1 https://github.com/XTLS/libXray.git
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init || true
          cd libXray
          python3 build/main.py android
          find . -name "*.aar"
          mkdir -p ../aar
          cp "$(find . -name '*.aar' | head -n1)" ../aar/libXray.aar

      - name: Download geoip / geosite
        run: |
          mkdir -p assets
          curl -fL -o assets/geoip.dat https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geoip.dat || curl -fL -o assets/geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fL -o assets/geosite.dat https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geosite.dat || curl -fL -o assets/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          ls -la assets

      - name: Assemble Flutter project and build APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter create --org com.dastras --project-name ng --platforms android app_build
          cd app_build
          rm -rf test lib analysis_options.yaml
          cp ../pubspec.yaml .
          cp -r ../lib .
          mkdir -p assets android/app/libs
          cp ../assets/geoip.dat ../assets/geosite.dat ../assets/logo.png assets/
          cp ../aar/libXray.aar android/app/libs/
          rm -rf android/app/src/main/res/mipmap-anydpi*
          cp -r ../android_overlay/res/* android/app/src/main/res/
          cp ../android_overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          KDIR=android/app/src/main/kotlin/com/dastras/ng
          mkdir -p $KDIR
          rm -f $KDIR/*.kt
          cp ../android_overlay/*.kt $KDIR/
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts << 'GRADLE'

          dependencies {
              implementation(files("libs/libXray.aar"))
          }
          GRADLE
          else
            cat >> android/app/build.gradle << 'GRADLE'

          dependencies {
              implementation files("libs/libXray.aar")
          }
          GRADLE
          fi
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.p12
            if [ -f android/app/build.gradle.kts ]; then
              cat >> android/app/build.gradle.kts << 'GRADLE'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("release.p12")
                      storePassword = System.getenv("KS_PASS")
                      keyAlias = "dastras"
                      keyPassword = System.getenv("KS_PASS")
                      storeType = "pkcs12"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          GRADLE
            else
              cat >> android/app/build.gradle << 'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.p12")
                      storePassword System.getenv("KS_PASS")
                      keyAlias "dastras"
                      keyPassword System.getenv("KS_PASS")
                      storeType "pkcs12"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
            fi
            echo "Signing with the release key"
          else
            echo "No release key secrets found - using the default debug signing"
          fi
          flutter pub get
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --dart-define=BUILD_NUMBER=${{ github.run_number }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/*-release.apk ../dist/
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define=BUILD_NUMBER=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/app-universal-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DastRas-NG-apk
          path: dist/*.apk

      - name: Publish release (the app reads this to offer updates)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DastRas NG build ${{ github.run_number }}
          body: |
            DastRas NG build ${{ github.run_number }}
          files: dist/*.apk
          make_latest: true

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build the Windows app
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter create --org com.dastras --project-name ng --platforms windows win_build
          cd win_build
          rm -rf test lib analysis_options.yaml
          cp ../pubspec.yaml .
          cp -r ../lib .
          mkdir -p assets
          cp ../assets/logo.png assets/
          : > assets/geoip.dat
          : > assets/geosite.dat
          cp ../windows_overlay/app_icon.ico windows/runner/resources/app_icon.ico
          sed -i 's/Win32Window::Size size(1280, 720);/Win32Window::Size size(440, 880);/' windows/runner/main.cpp
          sed -i 's/L"ng"/L"DastRas NG"/' windows/runner/main.cpp
          sed -i 's/set(BINARY_NAME "ng")/set(BINARY_NAME "DastRas-NG")/' windows/CMakeLists.txt
          # the Windows app keeps its data in plain preferences, so the native secure-storage plugin is replaced by an empty stub
          mkdir -p stubs/flutter_secure_storage/lib
          cat > stubs/flutter_secure_storage/pubspec.yaml << 'STUB'
          name: flutter_secure_storage
          version: 9.2.4
          environment:
            sdk: '>=3.0.0 <4.0.0'
          STUB
          cat > stubs/flutter_secure_storage/lib/flutter_secure_storage.dart << 'STUB'
          class FlutterSecureStorage {
            const FlutterSecureStorage();
            Future<String?> read({required String key}) async => null;
            Future<void> write({required String key, required String? value}) async {}
          }
          STUB
          printf '\ndependency_overrides:\n  flutter_secure_storage:\n    path: stubs/flutter_secure_storage\n' >> pubspec.yaml
          flutter pub get
          flutter build windows --release --obfuscate --split-debug-info=build/symbols --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Add Xray core and geo data, then zip
        shell: pwsh
        run: |
          $rel = "win_build/build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force "$rel/xray" | Out-Null
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray_tmp -Force
          Copy-Item xray_tmp/xray.exe "$rel/xray/xray.exe"
          foreach ($f in 'geoip.dat','geosite.dat') {
            try { Invoke-WebRequest "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/$f" -OutFile "$rel/xray/$f" -ErrorAction Stop }
            catch { Invoke-WebRequest "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/$f" -OutFile "$rel/xray/$f" }
          }
          Copy-Item $rel DastRas-NG -Recurse
          Compress-Archive -Path DastRas-NG -DestinationPath DastRas-NG-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DastRas-NG-windows
          path: DastRas-NG-windows.zip

      - name: Add the Windows zip to the release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: DastRas-NG-windows.zip
