name: Build DastRas NG APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build libXray (latest Xray-core)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export PATH="$PATH:$(go env GOPATH)/bin"
          git clone --depth 1 https://github.com/XTLS/libXray.git
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init || true
          cd libXray
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          # Go modules can not see Xray's v26.x release tags, so take the exact commit of the newest release
          tag=$(curl -fsSL https://api.github.com/repos/XTLS/Xray-core/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])" || true)
          sha=""
          if [ -n "$tag" ]; then
            sha=$(git ls-remote https://github.com/XTLS/Xray-core.git "refs/tags/${tag}^{}" | cut -f1)
            if [ -z "$sha" ]; then sha=$(git ls-remote https://github.com/XTLS/Xray-core.git "refs/tags/${tag}" | cut -f1); fi
          fi
          echo "newest Xray-core release: $tag ($sha)"
          if [ -n "$sha" ] && go get "github.com/xtls/xray-core@$sha" && go mod tidy && python3 build/main.py android; then
            echo "Built with Xray-core $tag"
            echo "$tag" > ../assets/xray_version.txt
          else
            echo "The newest core did not build - using the version pinned by libXray"
            cp go.mod.bak go.mod
            cp go.sum.bak go.sum
            python3 build/main.py android
            ver=$(go list -m -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' github.com/xtls/xray-core 2>/dev/null || true)
            if [ -z "$ver" ]; then ver=$(awk '/github.com\/xtls\/xray-core /{print $2; exit}' go.mod); fi
            echo "$ver" > ../assets/xray_version.txt
          fi
          cat ../assets/xray_version.txt
          find . -name "*.aar"
          mkdir -p ../aar
          cp "$(find . -name '*.aar' | head -n1)" ../aar/libXray.aar

      - name: Download geoip / geosite
        run: |
          mkdir -p assets
          curl -fL -o assets/geoip.dat https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geoip.dat || curl -fL -o assets/geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fL -o assets/geosite.dat https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geosite.dat || curl -fL -o assets/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          ls -la assets

      - name: Assemble Flutter project and build APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          flutter create --org com.dastras --project-name ng --platforms android app_build
          cd app_build
          rm -rf test lib analysis_options.yaml
          cp ../pubspec.yaml .
          cp -r ../lib .
          mkdir -p assets android/app/libs
          cp ../assets/geoip.dat ../assets/geosite.dat ../assets/logo.png ../assets/xray_version.txt assets/
          cp ../assets/flags.bin ../assets/tray.ico ../assets/tray.png assets/
          mkdir -p assets/fonts
          cp ../assets/fonts/*.ttf assets/fonts/ 2>/dev/null || true
          python3 ../scripts/add_font.py
          cp ../aar/libXray.aar android/app/libs/
          rm -rf android/app/src/main/res/mipmap-anydpi*
          cp -r ../android_overlay/res/* android/app/src/main/res/
          cp ../android_overlay/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          KDIR=android/app/src/main/kotlin/com/dastras/ng
          mkdir -p $KDIR
          rm -f $KDIR/*.kt
          cp ../android_overlay/*.kt $KDIR/
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts << 'GRADLE'

          dependencies {
              implementation(files("libs/libXray.aar"))
          }
          GRADLE
          else
            cat >> android/app/build.gradle << 'GRADLE'

          dependencies {
              implementation files("libs/libXray.aar")
          }
          GRADLE
          fi
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.p12
            if [ -f android/app/build.gradle.kts ]; then
              cat >> android/app/build.gradle.kts << 'GRADLE'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("release.p12")
                      storePassword = System.getenv("KS_PASS")
                      keyAlias = "dastras"
                      keyPassword = System.getenv("KS_PASS")
                      storeType = "pkcs12"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          GRADLE
            else
              cat >> android/app/build.gradle << 'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file("release.p12")
                      storePassword System.getenv("KS_PASS")
                      keyAlias "dastras"
                      keyPassword System.getenv("KS_PASS")
                      storeType "pkcs12"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
            fi
            echo "Signing with the release key"
          else
            echo "No release key secrets found - using the default debug signing"
          fi
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "Network problem - retry $i in $((i*40))s"; sleep $((i*40)); done; return 1; }
          # Maven Central sometimes answers 429 (too many requests) on shared runners: use Google's mirror first
          for f in android/settings.gradle.kts android/build.gradle.kts android/settings.gradle android/build.gradle; do
            if [ -f "$f" ]; then sed -i 's#^\(\s*\)mavenCentral()#\1maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n\1mavenCentral()#' "$f"; fi
          done
          retry flutter pub get
          retry flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --dart-define=BUILD_NUMBER=${{ github.run_number }}
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/*-release.apk ../dist/
          retry flutter build apk --release --obfuscate --split-debug-info=build/symbols --dart-define=BUILD_NUMBER=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/app-universal-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DastRas-NG-apk
          path: dist/*.apk

      - name: Publish release (the app reads this to offer updates)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          tag_name: build-${{ github.run_number }}
          name: DastRas NG build ${{ github.run_number }}
          body: |
            DastRas NG build ${{ github.run_number }}
          files: dist/*.apk
          make_latest: true

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get the latest Xray core (and its version)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray_tmp -Force
          (& ./xray_tmp/xray.exe -version | Select-Object -First 1) | Out-File -Encoding ascii xray_version.txt
          Get-Content xray_version.txt

      - name: Build the Windows app
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter create --org com.dastras --project-name ng --platforms windows win_build
          cd win_build
          rm -rf test lib analysis_options.yaml
          cp ../pubspec.yaml .
          cp -r ../lib .
          mkdir -p assets
          cp ../assets/logo.png assets/
          cp ../xray_version.txt assets/
          cp ../assets/flags.bin ../assets/tray.ico ../assets/tray.png assets/
          mkdir -p assets/fonts
          cp ../assets/fonts/*.ttf assets/fonts/ 2>/dev/null || true
          python ../scripts/add_font.py
          : > assets/geoip.dat
          : > assets/geosite.dat
          cp ../windows_overlay/app_icon.ico windows/runner/resources/app_icon.ico
          sed -i 's/Win32Window::Size size(1280, 720);/Win32Window::Size size(440, 880);/' windows/runner/main.cpp
          sed -i 's/L"ng"/L"DastRas NG"/' windows/runner/main.cpp
          sed -i 's/set(BINARY_NAME "ng")/set(BINARY_NAME "DastRas-NG")/' windows/CMakeLists.txt
          # the Windows app keeps its data in plain preferences, so the native secure-storage plugin is replaced by an empty stub
          mkdir -p stubs/flutter_secure_storage/lib
          cat > stubs/flutter_secure_storage/pubspec.yaml << 'STUB'
          name: flutter_secure_storage
          version: 9.2.4
          environment:
            sdk: '>=3.0.0 <4.0.0'
          STUB
          cat > stubs/flutter_secure_storage/lib/flutter_secure_storage.dart << 'STUB'
          class FlutterSecureStorage {
            const FlutterSecureStorage();
            Future<String?> read({required String key}) async => null;
            Future<void> write({required String key, required String? value}) async {}
          }
          STUB
          printf '\ndependency_overrides:\n  flutter_secure_storage:\n    path: stubs/flutter_secure_storage\n' >> pubspec.yaml
          ARGS="--release --obfuscate --split-debug-info=build/symbols --dart-define=BUILD_NUMBER=${{ github.run_number }}"
          # try with the system-tray plugins first; if they do not build, build without the tray icon
          cp ../scripts/desktop_shell_real.dart lib/desktop_shell.dart
          if flutter pub add tray_manager:^0.2.4 window_manager:^0.4.3 && flutter pub get && flutter build windows $ARGS; then
            echo "Built with the tray icon"
          else
            echo "Tray plugins failed - building without the tray icon"
            cp ../lib/desktop_shell.dart lib/desktop_shell.dart
            sed -i '/tray_manager/d;/window_manager/d' pubspec.yaml
            flutter pub get
            flutter build windows $ARGS
          fi

      - name: Add Xray core and geo data, then zip
        shell: pwsh
        run: |
          $rel = "win_build/build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force "$rel/xray" | Out-Null
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray_tmp -Force
          Copy-Item xray_tmp/xray.exe "$rel/xray/xray.exe"
          foreach ($f in 'geoip.dat','geosite.dat') {
            try { Invoke-WebRequest "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/$f" -OutFile "$rel/xray/$f" -ErrorAction Stop }
            catch { Invoke-WebRequest "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/$f" -OutFile "$rel/xray/$f" }
          }
          Copy-Item $rel DastRas-NG -Recurse
          Compress-Archive -Path DastRas-NG -DestinationPath DastRas-NG-windows.zip -Force

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Copy-Item windows_overlay/installer.iss installer.iss
          Copy-Item windows_overlay/app_icon.ico app_icon.ico
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=2.1.${{ github.run_number }}" "/DSourceDir=$PWD\DastRas-NG" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: DastRas-NG-windows
          path: |
            DastRas-NG-windows.zip
            Output/DastRas-NG-Setup.exe

      - name: Add the Windows zip to the release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: |
            DastRas-NG-windows.zip
            Output/DastRas-NG-Setup.exe

  macos:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get the latest Xray core for both Mac CPUs
        run: |
          mkdir -p xray_mac
          for pair in "arm64-v8a:arm64" "64:x64"; do
            src="${pair%%:*}"
            dst="${pair##*:}"
            curl -fsSL -o x.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-macos-$src.zip"
            rm -rf x_tmp && mkdir x_tmp && unzip -q x.zip -d x_tmp
            cp x_tmp/xray "xray_mac/xray-$dst"
            chmod +x "xray_mac/xray-$dst"
          done
          for f in geoip.dat geosite.dat; do
            curl -fsSL -o "xray_mac/$f" "https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/$f" || curl -fsSL -o "xray_mac/$f" "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/$f"
          done
          if [ "$(uname -m)" = "arm64" ]; then ./xray_mac/xray-arm64 -version | head -n 1 > xray_version.txt; else ./xray_mac/xray-x64 -version | head -n 1 > xray_version.txt; fi
          cat xray_version.txt

      - name: Build the macOS app
        run: |
          flutter config --enable-macos-desktop
          flutter create --org com.dastras --project-name ng --platforms macos mac_build
          cd mac_build
          rm -rf test lib analysis_options.yaml
          cp ../pubspec.yaml .
          cp -r ../lib .
          mkdir -p assets
          cp ../assets/logo.png assets/
          cp ../xray_version.txt assets/
          cp ../assets/flags.bin ../assets/tray.ico ../assets/tray.png assets/
          : > assets/geoip.dat
          : > assets/geosite.dat
          mkdir -p assets/fonts
          cp ../assets/fonts/*.ttf assets/fonts/ 2>/dev/null || true
          python3 ../scripts/add_font.py
          for s in 16 32 64 128 256 512 1024; do sips -z $s $s ../assets/logo.png --out macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_$s.png > /dev/null; done
          # the app starts the bundled Xray, so the App Sandbox must be off
          python3 - << 'PY'
          import re, glob
          for f in glob.glob('macos/Runner/*.entitlements'):
              s = open(f).read()
              s = re.sub(r'(com.apple.security.app-sandbox</key>\s*)<true/>', r'\1<false/>', s)
              open(f, 'w').write(s)
          PY
          sed -i '' 's/^PRODUCT_NAME = .*/PRODUCT_NAME = DastRas NG/' macos/Runner/Configs/AppInfo.xcconfig
          # data is kept in plain preferences on desktop, so the native secure-storage plugin is replaced by an empty stub
          mkdir -p stubs/flutter_secure_storage/lib
          cat > stubs/flutter_secure_storage/pubspec.yaml << 'STUB'
          name: flutter_secure_storage
          version: 9.2.4
          environment:
            sdk: '>=3.0.0 <4.0.0'
          STUB
          cat > stubs/flutter_secure_storage/lib/flutter_secure_storage.dart << 'STUB'
          class FlutterSecureStorage {
            const FlutterSecureStorage();
            Future<String?> read({required String key}) async => null;
            Future<void> write({required String key, required String? value}) async {}
          }
          STUB
          printf '\ndependency_overrides:\n  flutter_secure_storage:\n    path: stubs/flutter_secure_storage\n' >> pubspec.yaml
          ARGS="--release --obfuscate --split-debug-info=build/symbols --dart-define=BUILD_NUMBER=${{ github.run_number }}"
          # try with the system-tray plugins first; if they do not build, build without the tray icon
          cp ../scripts/desktop_shell_real.dart lib/desktop_shell.dart
          if flutter pub add tray_manager:^0.2.4 window_manager:^0.4.3 && flutter pub get && flutter build macos $ARGS; then
            echo "Built with the tray icon"
          else
            echo "Tray plugins failed - building without the tray icon"
            cp ../lib/desktop_shell.dart lib/desktop_shell.dart
            sed -i '' '/tray_manager/d;/window_manager/d' pubspec.yaml
            flutter pub get
            flutter build macos $ARGS
          fi

      - name: Bundle Xray, sign and make the disk image
        run: |
          APP=$(ls -d mac_build/build/macos/Build/Products/Release/*.app | head -n 1)
          mkdir -p "$APP/Contents/Resources/xray"
          cp xray_mac/* "$APP/Contents/Resources/xray/"
          chmod +x "$APP/Contents/Resources/xray/"xray-*
          codesign --force --deep -s - "$APP"
          mkdir dmg_root
          cp -R "$APP" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "DastRas NG" -srcfolder dmg_root -ov -format UDZO DastRas-NG-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: DastRas-NG-macOS
          path: DastRas-NG-macOS.dmg

      - name: Add the macOS disk image to the release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: DastRas-NG-macOS.dmg
